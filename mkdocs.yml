site_name: Elektronické obchodovanie
site_description: Predmet Elektronické obchodovanie pre študentov programu Elektronický obchod a manažment (FPEDAS UNIZA).
site_author: Juraj Fabuš
site_url: https://eo.fabus.eu/
repo_url: https://github.com/saman1001/elektronicke-obchodovanie
repo_name: elektronicke-obchodovanie
# Odkaz na súkromie je absolútny — copyright HTML sa vkladá na každú stránku
# (aj v podpriečinkoch), relatívna cesta by sa tam rozbila
copyright: "© 2026 Elektronické obchodovanie · Žilinská univerzita v Žiline · <a href='https://eo.fabus.eu/ochrana-sukromia.html'>Ochrana súkromia</a>"
docs_dir: docs
# false = generuje blok-8.html (nie blok-8/index.html), aby sa HTML dalo otvoriť aj dvojklikom (file://)
use_directory_urls: false

theme:
  name: material
  custom_dir: overrides
  language: sk
  logo: img/logo-eo.png
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Prepnúť na tmavý režim
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Prepnúť na svetlý režim
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono

extra_css:
  - stylesheets/extra.css
  # komponenty redizajnu (dashboard, dráha, hlavička bloku, sekcie bloku)
  - stylesheets/komponenty.css

extra_javascript:
  - javascripts/copy-lokalne.js
  # fade-in sekcií dashboardu pri scrollovaní
  - javascripts/animacie.js
  # zväčšenie karty infografiky do prekrytia
  - javascripts/infografiky.js
  # Analytika: self-hosted Umami (bez cookies, bez consent banneru) — viď umami.js
  - javascripts/umami.js

markdown_extensions:
  - admonition
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  # vkladanie HTML kariet infografík zo snippets/ do blokov (--8<-- "infografiky/blok-2.html")
  - pymdownx.snippets:
      base_path: [snippets]
      check_paths: true
  - md_in_html
  - tables
  - toc:
      permalink: true

# Dráha blokov a vizuál sekcií bloku sa skladajú pri builde z metadát stránok (viď hooks/eo_bloky.py)
hooks:
  - hooks/eo_bloky.py

# Štyri časti predmetu pre dashboard a hlavičku bloku. Bloky sa priraďujú podľa front matter
# blok a cast na stránkach blokov, takže nový blok stačí pridať do nav s týmito metadátami.
extra:
  # Brána: spoločné heslo pre študentov, overuje sa v prehliadači (docs/javascripts/gate.js).
  # gate_hash je SHA-256 hesla (postup v README), heslo samotné sa do repozitára nikdy nepíše.
  # gate_enabled: false bránu vypne bez mazania kódu.
  gate_enabled: false
  gate_hash: ""
  casti:
    - cislo: 1
      nazov: Firma a infraštruktúra
      popis: Vyberieš si firmu a sortiment, nájdeš jej pripojenie do internetu a hosting pre e-shop. Naučíš sa metódu, ktorou sa vyberá akýkoľvek poskytovateľ.
      ikona: budova
      url: 01-firma-a-infrastruktura/index.md
    - cislo: 2
      nazov: Stavba e-shopu
      popis: Založíš e-shop, naplníš ho produktmi, rozbehneš košík s dopravou a platbami a doplníš stránky, ktoré e-shop musí mať zo zákona.
      ikona: kosik
      url: 02-stavba-eshopu/index.md
    - cislo: 3
      nazov: Reklama
      popis: Vyrobíš bannery a vymeníš si reklamu so spolužiakom. Blok 9 je nadplán s prehľadom ďalších foriem reklamy a merania z praxe.
      ikona: megafon
      url: 03-reklama/index.md
    - cislo: 4
      nazov: Záver
      popis: Referát, offline kópia e-shopu, prezentácia a obhajoba pred spolužiakmi, ktorí ťa aj hodnotia.
      ikona: vlajka
      url: 04-zaver/blok-10-odovzdanie.md

plugins:
  - search
  # Spojená stránka celého webu na print_page.html — slúži na PDF archív semestra (Ctrl+P alebo headless Chrome)
  - print-site:
      add_to_navigation: false
      add_cover_page: true
      enumerate_headings: false
      add_print_site_banner: false

nav:
  - Úvod: index.md
  - "Časť 1 — Firma a infraštruktúra":
      - Prehľad: 01-firma-a-infrastruktura/index.md
      - "Blok 1 — Firma a produkt": 01-firma-a-infrastruktura/blok-1-firma-a-produkt.md
      - "Blok 2 — Pripojenie do internetu": 01-firma-a-infrastruktura/blok-2-pripojenie-do-internetu.md
      - "Blok 3 — Hosting a platforma": 01-firma-a-infrastruktura/blok-3-hosting-a-platforma.md
  - "Časť 2 — Stavba e-shopu":
      - Prehľad: 02-stavba-eshopu/index.md
      - "Blok 4 — Základ e-shopu": 02-stavba-eshopu/blok-4-zaklad-eshopu.md
      - "Blok 5 — Produkty": 02-stavba-eshopu/blok-5-produkty.md
      - "Blok 6 — Košík, doprava a platby": 02-stavba-eshopu/blok-6-kosik-doprava-platby.md
      - "Blok 7 — Povinné stránky e-shopu": 02-stavba-eshopu/blok-7-povinne-stranky.md
  - "Časť 3 — Reklama":
      - Prehľad: 03-reklama/index.md
      - "Blok 8 — Bannery": 03-reklama/blok-8-bannery.md
      - "Blok 9 — Reklama a meranie": 03-reklama/blok-9-reklama-a-meranie.md
  - "Záver":
      - "Blok 10 — Odovzdanie projektu": 04-zaver/blok-10-odovzdanie.md
      - "Bloky 11–12 — Obhajoby": 04-zaver/blok-11-12-obhajoby.md
  - "Znalostná báza":
      - Prehľad: znalostna-baza/index.md
      - "Semestrálny projekt a hodnotenie": znalostna-baza/semestralny-projekt.md
      - "Tabuľka 10 poskytovateľov": znalostna-baza/tabulka-10-poskytovatelov.md
      - "Internet, doména a DNS": znalostna-baza/internet-domena-dns.md
      - "AI v predmete": znalostna-baza/ai-v-predmete.md
      - "Logo a produktové foto pomocou AI": znalostna-baza/ai-logo-a-foto.md
      - "WordPress a WooCommerce": znalostna-baza/wordpress-woocommerce.md
      - "Webnode": znalostna-baza/webnode.md
      - "Offline kópia webu (HTTrack)": znalostna-baza/httrack-offline-kopia.md
      - "Šablóny na stiahnutie": znalostna-baza/sablony.md
