# Automatické nasadenie webu predmetu na GitHub Pages (https://eo.fabus.eu).
# Spustí sa pri každom pushi do main, ktorý mení obsah webu; ručne cez Actions → Run workflow.
# Ak build zlyhá (typicky rozbitý odkaz), web ostane v poslednej funkčnej verzii.
name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "overrides/**"
      - "hooks/**"
      - "snippets/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write   # zápis do vetvy gh-pages

concurrency:
  group: deploy-gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Verzie pripnuté na tie, ktoré sú overené lokálnym buildom. Aktualizovať vedome, nie automaticky
      # (Material varuje, že MkDocs 2.0 rozbije pluginy aj theme overrides).
      - name: Nainštaluj MkDocs a pluginy
        run: pip install mkdocs==1.6.1 mkdocs-material==9.7.7 mkdocs-print-site-plugin==2.8

      - name: Zostav web a nasaď do vetvy gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --force --strict --no-history
